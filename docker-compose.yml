services:
  postgres:
    image: postgres:17
    container_name: egms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_db
    ports:
      - "5432:5432"
    volumes:
      - egms_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: egms-redis
    restart: unless-stopped
    command: redis-server --requirepass test
    ports:
      - "6379:6379"
    volumes:
      - egms_redis_data:/data

volumes:
  egms_postgres_data:
  egms_redis_data:
